research:
  - title:
      en: "Bachelor Thesis — Data Preservation in Big Data Environments"
      id: "Skripsi — Preservasi Data pada Lingkungan Big Data"
    org: Universitas Gadjah Mada
    role: {en: Principal Investigator, id: Peneliti Utama}
    start: 2017-02
    end: 2017-11
    tier: 2
    tags: [academic, eu-industry]
    bullets:
      en:
        - Proposed an ISO 14721:2012 (OAIS) data preservation framework for big data environments, mapping the standard's six components onto a distributed stack.
        - Deployed a fully distributed nine-node Hadoop cluster and integrated Apache Solr search into Hadoop MapReduce.
        - Advised by Dr. Mardhani Riasetiawan; published at IEEE ICST 2018.
      id:
        - Merumuskan kerangka kerja preservasi data jangka panjang berbasis standar ISO 14721:2012 (OAIS) pada lingkungan big data, dengan memetakan enam komponen standar ke dalam arsitektur komputasi terdistribusi.
        - Mengonfigurasi dan menguji klaster komputasi terdistribusi Hadoop (9 node) serta mengintegrasikan mesin pencarian Apache Solr ke dalam Hadoop MapReduce.
        - Dibimbing oleh Dr. Mardhani Riasetiawan; hasil riset dipublikasikan pada konferensi internasional IEEE ICST 2018.

  - title:
      en: "Cyber Banking Fraud Research Project"
      id: "Proyek Riset Cyber Banking Fraud"
    org: Computer System and Networking Research Laboratory, Universitas Gadjah Mada
    role: {en: Research Assistant, id: Asisten Peneliti}
    start: 2016-02
    end: 2016-10
    tier: 2
    tags: [academic]
    bullets:
      en:
        - Proposed a Self-Organizing Map approach to banking fraud detection.
        - Coordinated weekly team meetings and represented the project members to the principal investigator.
        - Funded by the national flagship higher-education research grant (Penelitian Unggulan Perguruan Tinggi), Ministry of Research, Technology and Higher Education.
      id:
        - Mengembangkan pendekatan algoritma Self-Organizing Maps (SOM) untuk deteksi transaksi perbankan anomali dan indikasi fraud.
        - Mengoordinasikan agenda riset berkala tim peneliti dan bertindak sebagai narahubung teknis kepada ketua peneliti.
        - Didanai oleh skema hibah Penelitian Unggulan Perguruan Tinggi (PUPT), Kementerian Riset, Teknologi, dan Pendidikan Tinggi RI.

