# =============================================================================
# LANDING PAGE — content that is editorial, not record.
# =============================================================================
# Everything above is the CV record. This block is the copy for the front page
# at kristonova.github.io/ : positioning, practice areas, and UI labels. It
# lives here so the site still has exactly one source file.
#
# Every *number* on the landing page is counted from the data above by
# build.py — never write a figure here. The one exception is `people_trained`,
# which is not derivable from prose bullets; update it by hand when it changes.
# =============================================================================
site:
  url: https://kristonova.github.io/
  photo: foto-kristo-portrait.jpg   # cropped from foto-kristo.jpeg; see README
  people_trained: 340

  role:
    en: Data Scientist & Enterprise Data Architect
    id: Data Scientist & Arsitek Data Enterprise

  # The first thing a non-technical executive reads. Plain language, the
  # problem solved — not the job title.
  positioning:
    en: >-
      I design the data systems Indonesian ministries and companies run on —
      from the architecture underneath to the decisions taken on top of it.
    id: >-
      Saya membantu kementerian dan korporasi di Indonesia membangun sistem data yang andal —
      mulai dari fondasi arsitektur data hingga implementasi analitik untuk pengambilan keputusan strategis.

  # Credentials as proof directly under the positioning, not as identity.
  credentials:
    en:
      - M.Sc. Data Science, EURECOM France · LPDP Scholar
      - B.Sc. Computer Science with Honours, Universitas Gadjah Mada
      - CEO & Co-founder, Sadasa Academy · BNSP-licensed assessor
    id:
      - M.Sc. Data Science, EURECOM Prancis · Penerima Beasiswa LPDP
      - S.Kom. Ilmu Komputer (Cum Laude), Universitas Gadjah Mada
      - CEO & Co-founder Sadasa Academy · Asesor Kompetensi Berlisensi BNSP

  cta_label:
    en: Get in touch
    id: Hubungi Saya
  cta_body:
    en: >-
      Working out your organisation's data, or looking for someone fluent in
      the business side and the technical side at once? Tell me what you are
      trying to decide — that is usually the fastest way in.
    id: >-
      Sedang merapikan tata kelola data organisasi Anda, atau membutuhkan tenaga ahli yang fasih
      menghubungkan kebutuhan bisnis dengan solusi teknis? Mari berdiskusi tentang tantangan
      data dan arah keputusan yang ingin Anda capai.

  # Four practice areas in plain language. `evidence` is institution names,
  # so it is deliberately not translated.
  practice:
    - name:
        en: Data & enterprise architecture
        id: Arsitektur data & enterprise
      what:
        en: >-
          The blueprint for an organisation's data: what data exists, who owns
          it, how it moves between systems, and what has to be built first.
        id: >-
          Menyusun cetak biru arsitektur data organisasi: pemetaan entitas dan kepemilikan data,
          perancangan alur integrasi antarsistem, serta penyusunan peta jalan (roadmap) prioritas implementasi.
      evidence: Kementerian Kesehatan RI · PT Bio Farma (14 anggota holding) · Dewan Energi Nasional · BSSN · PDAM Pontianak

    - name:
        en: Executive analytics & dashboards
        id: Analitik & dashboard eksekutif
      what:
        en: >-
          Turning scattered data into one screen a leadership team can actually
          decide from — and explaining the finding to the people who sign off
          on it.
        id: >-
          Mengintegrasikan data yang terfragmentasi menjadi dashboard eksekutif yang aplikatif,
          serta menerjemahkan wawasan teknis menjadi dasar pertimbangan konkret bagi pimpinan dan pengambil kebijakan.
      evidence: Komisi Pemberantasan Korupsi (KPK) · Diskominfo DIY · RSUP Dr. Sardjito · Kementerian Desa PDT dan Transmigrasi

    - name:
        en: Training & competency assessment
        id: Pelatihan & asesmen kompetensi
      what:
        en: >-
          Building data capability inside a team — from technical staff to the
          board — and certifying it against Indonesia's SKKNI standards under a
          BNSP licence.
        id: >-
          Meningkatkan kapabilitas data tim internal—mulai dari staf teknis hingga jajaran pimpinan—serta
          menyelenggarakan uji kompetensi berbasis SKKNI melalui skema sertifikasi resmi BNSP.
      evidence: Kementerian Keuangan RI (183 ASN) · BAPPENAS · BMKG · PT Adaro Indonesia · LSP Teknologi Digital

    - name:
        en: AI & language models in operations
        id: AI & model bahasa untuk operasional
      what:
        en: >-
          Putting large language models to work on the repetitive part of a
          job, so the team spends its time on the part that genuinely needs a
          person.
        id: >-
          Menerapkan teknologi Large Language Model (LLM) untuk mengotomasi alur kerja operasional
          yang repetitif, sehingga tim dapat lebih berfokus pada pekerjaan strategis bernilai tinggi.
      evidence: EFISON Lisan Teknologi (dukungan HPC L1) · Kopi Kenangan · Universitas Gadjah Mada

