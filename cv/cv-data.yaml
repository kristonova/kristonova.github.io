summary:
  en: >-
    Data scientist and enterprise data architect with 8+ years designing national-scale
    data systems for Indonesian ministries and state-owned enterprises, and CEO and
    co-founder of a data analytics training and consulting firm. M.Sc. in Data Science
    from EURECOM, France, with thesis and internship work on LLM-based support for
    high-performance computing. Delivered TOGAF data architectures for the Ministry of
    Health, the National Energy Council, and the state pharmaceutical holding; trained
    and assessed 340+ civil servants, executives, and students.
  id: >-
    Praktisi Data Science dan Arsitek Data Enterprise dengan pengalaman lebih dari 8 tahun
    dalam merancang ekosistem data berskala nasional untuk berbagai kementerian, lembaga,
    dan BUMN di Indonesia. Co-founder & CEO Sadasa Academy (konsultan dan pelatihan analitika
    data). Lulusan M.Sc. Data Science dari EURECOM Prancis, dengan fokus riset tesis dan magang
    pada pengembangan solusi LLM untuk High-Performance Computing (HPC). Berpengalaman menyusun
    arsitektur data berbasis kerangka kerja TOGAF di Kementerian Kesehatan, Dewan Energi Nasional,
    dan Holding BUMN Farmasi (Bio Farma); serta telah melatih dan menguji kompetensi 340+ ASN,
    eksekutif, dan mahasiswa.

