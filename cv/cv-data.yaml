# -----------------------------------------------------------------------------
research:
  - title:
      en: "M.Sc. Thesis — LLM Prototype for L1 High-Performance Computing (HPC) Support"
      id: "Tesis M.Sc. — Prototipe LLM untuk Dukungan L1 High-Performance Computing (HPC)"
    org: EURECOM, with EFISON Lisan Teknologi
    role: {en: Principal Investigator, id: Peneliti Utama}
    start: 2026-02
    end: 2026-07
    tier: 1
    tags: [academic, eu-industry, id-industry]
    bullets:
      en:
        - "Studied whether domain-specific RAG can deliver reliable L1 support for a national HPC facility on a single consumer-grade AMD GPU, using the ALELEON Supercomputer wiki (411 documents) as the only knowledge source."
        - "Benchmarked dense, sparse, multi-vector, and hybrid retrieval in Qdrant over 69 queries: hybrid retrieval gave the best balance of recall and indexing cost, while LLM generation accounted for over 99% of end-to-end latency (about 8.8 s per answer), so faster retrieval could not speed up the system."
        - "Load-tested the service under concurrent users: throughput stayed at about 0.05 requests per second and average latency rose from 20.4 s to 230.6 s at 16 concurrent users, showing the single-GPU inference engine is compute-bound."
        - "Designed a four-level accuracy evaluation (direct facts, multi-chunk, reasoning, anti-hallucination) graded with the company supervisor: 81.8% overall, with reasoning at 60% limited mainly by outdated and inconsistent wiki content."
        - "Thesis report “Development of a Large Language Model (LLM) Prototype for L1 High-Performance Computing (HPC) Support”, defended on 2 July 2026; supervised by Prof. Simone Rossi and Wilson Lisan."
      id:
        - "Meneliti apakah RAG khusus domain dapat memberi dukungan teknis L1 yang andal bagi fasilitas HPC nasional dengan satu GPU AMD kelas konsumen, memakai wiki ALELEON Supercomputer (411 dokumen) sebagai satu-satunya sumber pengetahuan."
        - "Membandingkan strategi retrieval dense, sparse, multi-vector, dan hibrida di Qdrant dengan 69 pertanyaan uji: retrieval hibrida memberi keseimbangan terbaik antara recall dan biaya indeksasi, sementara generasi LLM menyerap lebih dari 99% latensi end-to-end (sekitar 8,8 detik per jawaban), sehingga mempercepat retrieval tidak berdampak pada kecepatan sistem."
        - "Menguji beban layanan dengan permintaan bersamaan: throughput tertahan di sekitar 0,05 permintaan per detik dan latensi rata-rata naik dari 20,4 detik menjadi 230,6 detik pada 16 pengguna bersamaan; ini menunjukkan mesin inferensi satu GPU bersifat compute-bound."
        - "Merancang evaluasi akurasi empat tingkat (fakta langsung, multi-chunk, penalaran, anti-halusinasi) yang dinilai bersama pembimbing perusahaan: akurasi keseluruhan 81,8%, dengan akurasi penalaran 60% karena sebagian konten wiki sudah usang dan tidak konsisten."
        - "Laporan tesis “Development of a Large Language Model (LLM) Prototype for L1 High-Performance Computing (HPC) Support”, disidangkan pada 2 Juli 2026; pembimbing Prof. Simone Rossi dan Wilson Lisan."

  - title:
      en: "M.Sc. Semester Project — KV Cache Compression for Text-to-SQL with LLMs"
      id: "Semester Project M.Sc. — Kompresi KV Cache untuk Text-to-SQL dengan LLM"
    org: EURECOM, Data Science Department
    role: {en: Student Researcher (team of two), id: Peneliti Mahasiswa (tim dua orang)}
    start: 2025-09
    end: 2026-02
    tier: 1
    tags: [academic, eu-industry]
    bullets:
      en:
        - "Migrated the long-context NL2SQL framework lc-nl2sql (“Is Long Context All You Need?”, VLDB 2025) from Vertex AI/Gemini to local open-weight inference through an abstract model interface, giving direct access to the model's KV cache."
        - "Integrated NVIDIA kvpress to compare query-aware FINCH against query-agnostic Expected Attention compression, running Qwen3-4B on an H100 cluster across 72 configurations: 8 cumulative ablation scenarios × 4 compression ratios plus an uncompressed baseline, on a difficulty-stratified 132-question BIRD dev subset."
        - "FINCH at a 0.6 compression ratio reached 51.52% execution accuracy, above the uncompressed baseline (49.24%), while a 0.8 ratio fell to 43.94%; compression also prevented out-of-memory failures in the self-correction stage."
        - "Supervised by Prof. Paolo Papotti and Giulio Corallo (PhD); delivered with Tommaso La Malfa as code, final report, and presentation with demo."
      id:
        - "Memigrasikan framework NL2SQL berkonteks panjang lc-nl2sql (“Is Long Context All You Need?”, VLDB 2025) dari Vertex AI/Gemini ke inferensi lokal model open-weight melalui antarmuka abstrak, agar KV cache model bisa diakses langsung."
        - "Mengintegrasikan NVIDIA kvpress untuk membandingkan kompresi FINCH (query-aware) dengan Expected Attention (query-agnostic) pada Qwen3-4B di klaster H100, mencakup 72 konfigurasi: 8 skenario ablasi kumulatif × 4 rasio kompresi ditambah baseline tanpa kompresi, pada 132 soal BIRD dev yang dikelompokkan berimbang menurut tingkat kesulitan."
        - "FINCH dengan rasio kompresi 0,6 mencapai execution accuracy 51,52%, di atas baseline tanpa kompresi (49,24%), sedangkan rasio 0,8 turun ke 43,94%; kompresi juga mencegah kegagalan out-of-memory pada tahap self-correction."
        - "Dibimbing oleh Prof. Paolo Papotti dan Giulio Corallo (PhD); dikerjakan bersama Tommaso La Malfa dan menghasilkan kode, laporan akhir, presentasi, serta demo."

  - title:
      en: "Bachelor Thesis — Data Preservation in Big Data Environments"
      id: "Skripsi — Preservasi Data pada Lingkungan Big Data"
    org: Universitas Gadjah Mada
    role: {en: Principal Investigator, id: Peneliti Utama}
    start: 2017-02
    end: 2017-11
    tier: 2
    tags: [academic, eu-industry]
    bullets:
      en:
        - Proposed an ISO 14721:2012 (OAIS) data preservation framework for big data environments, mapping the standard's six components onto a distributed stack.
        - Deployed a fully distributed nine-node Hadoop cluster and integrated Apache Solr search into Hadoop MapReduce.
        - Advised by Dr. Mardhani Riasetiawan; published at IEEE ICST 2018.
      id:
        - Merumuskan kerangka kerja preservasi data berbasis standar ISO 14721:2012 (OAIS) untuk lingkungan big data dengan memetakan enam komponen standarnya ke dalam arsitektur terdistribusi.
        - Mengonfigurasi dan menguji klaster komputasi terdistribusi Hadoop (9 node) serta mengintegrasikan mesin pencarian Apache Solr ke dalam Hadoop MapReduce.
        - Dibimbing oleh Dr. Mardhani Riasetiawan; hasil riset dipublikasikan di konferensi internasional IEEE ICST 2018.

  - title:
      en: "Cyber Banking Fraud Research Project"
      id: "Proyek Riset Cyber Banking Fraud"
    org: Computer System and Networking Research Laboratory, Universitas Gadjah Mada
    role: {en: Research Assistant, id: Asisten Peneliti}
    start: 2016-02
    end: 2016-10
    tier: 2
    tags: [academic]
    bullets:
      en:
        - Proposed a Self-Organizing Map approach to banking fraud detection.
        - Coordinated weekly team meetings and represented the project members to the principal investigator.
        - Funded by the national flagship higher-education research grant (Penelitian Unggulan Perguruan Tinggi), Ministry of Research, Technology and Higher Education.
      id:
        - Mengusulkan pendekatan algoritma Self-Organizing Map (SOM) untuk mendeteksi indikasi penipuan (fraud) pada transaksi perbankan.
        - Mengoordinasikan rapat mingguan tim peneliti dan menjadi penghubung anggota tim dengan ketua peneliti.
        - Didanai oleh hibah Penelitian Unggulan Perguruan Tinggi (PUPT), Kementerian Riset, Teknologi, dan Pendidikan Tinggi RI.

